name: Verify
on: [push, pull_request]
jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The current Windows Server 2025 image stalls in Windows PowerShell module discovery.
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Check Windows helper runtime
        if: runner.os == 'Windows'
        run: node scripts/check-windows-runtime.mjs
      - name: Tests
        run: npm test -- --no-file-parallelism --maxWorkers 1 --bail 1 --reporter verbose
      - run: npm audit --audit-level=moderate
      - run: npm pack --dry-run
