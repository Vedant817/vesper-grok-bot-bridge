name: Verify
on: [push, pull_request]
# Least privilege: checkout and package dry-run need nothing beyond reading the repo.
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # If a new Windows image stalls in PowerShell module discovery, pin windows-2022 (see commit history).
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Check Windows helper runtime
        if: runner.os == 'Windows'
        run: node scripts/check-windows-runtime.mjs
      - name: Tests
        # Native Windows credential/ACL helpers can exceed Vitest's unit-test defaults.
        run: npm test -- --no-file-parallelism --maxWorkers 1 --bail 1 --reporter verbose --testTimeout 30000 --hookTimeout 60000
      - run: npm audit --audit-level=moderate
      - run: npm pack --dry-run
